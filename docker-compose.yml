version: "3.9"

services:
  discord-bot:
    build: .
    container_name: discord-bot
    env_file: .env  # TOKEN_DISCORD, EDITOR_ROLE_ID, POSTGRES_PASSWORD : voir .env.example
    environment:
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD}@db:5432/sondages
    restart: always
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: discord_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: sondages
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # accessible seulement depuis la machine

volumes:
  postgres_data: